server:
  port: 8096

spring:
  application:
    name: git-arena

  datasource:
    url: jdbc:postgresql://localhost:5432/git-arena?stringtype=unspecified
    username: postgres
    password: 556AW334
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # 全新库从 V1 起建，无需 baseline

  mail:
    host: smtp.qq.com
    port: 587
    username: ${email.username:}
    password: ${email.password:}
    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection timeout: 5000
          timeout: 5000
          write timeout: 5000


# 采用数据库表主键递增策略
mybatis-plus:
  global-config:
    db-config:
      id-type: auto