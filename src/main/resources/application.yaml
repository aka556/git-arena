server:
  port: 8096

spring:
  application:
    name: git-arena

  datasource:
    url: jdbc:postgresql://localhost:5432/git-arena?stringtype=unspecified
    username: postgres
    password: 556AW334
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # 全新库从 V1 起建，无需 baseline

  mail:
    host: smtp.qq.com
    port: 587
    username: ${email.username:}
    password: ${email.password:}
    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection timeout: 5000
          timeout: 5000
          write timeout: 5000


# 采用数据库表主键递增策略
mybatis-plus:
  global-config:
    db-config:
      id-type: auto

# 定时运维作业（database.md §9；触发器见 config/MaintenanceScheduler）
git-arena:
  maintenance:
    enabled: true            # 置 false 整体停掉定时作业（本地调试用；停掉后沙盒不再回收）
    sandbox-ttl: PT24H       # 沙盒台账 expires_at 的滑动窗口，成员活动即续期
    session-idle-ttl: PT6H   # 单人沙盒内存句柄空闲多久算废弃（无台账，只能按内存活跃度判定）
    batch-size: 200          # 单轮扫描上限，避免一次删太多长事务锁表